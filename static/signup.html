<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ResQAlert</title>
    <link rel="stylesheet" href="signup-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">ResQAlert</a>
        <a href="index.html" class="back-link">← Back to Home</a>
    </nav>

    <div class="signup-container">
        <div class="signup-header">
            <h1>Sign Up</h1>
            <p>Create your disaster monitoring account</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="continue-btn">Create Account</button>
        </form>

        <div class="divider">
            <span>Or sign up with</span>
        </div>

        <div class="social-buttons">
            <button type="button" class="social-btn" onclick="handleSocialLogin('google')">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="social-icon">
                <span>Google</span>
            </button>


            <button type="button" class="social-btn" onclick="handleSocialLogin('apple')">
                <svg class="social-icon" viewBox="0 0 24 24" fill="white">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
                <span>Sign in with Apple</span>
            </button>

            <button type="button" class="social-btn" onclick="handleSocialLogin('facebook')">
                <svg class="social-icon" viewBox="0 0 24 24" fill="#1877F2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                <span>Facebook</span>
            </button>

        </div>  

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>

    </div>
    <script>
    // Prevent default form submission
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Stop form from submitting normally
    });

    // Handle signup button click
    document.querySelector('.continue-btn').addEventListener('click', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value; // Changed to match your ID
        
        if (!name || !email || !password || !confirmPassword) {
            alert('⚠️ Please fill in all fields');
            return;
        }
        
        if (password !== confirmPassword) {
            alert('⚠️ Passwords do not match');
            return;
        }
        
        if (password.length < 6) {
            alert('⚠️ Password must be at least 6 characters long');
            return;
        }
        
        // Show loading state
        const btn = this;
        const originalText = btn.textContent;
        btn.textContent = 'Creating Account...';
        btn.disabled = true;
        
        try {
            const response = await fetch('http://localhost:5000/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                btn.textContent = '✅ Success! Redirecting...';
                
                // Redirect to Streamlit after 1 second
                setTimeout(() => {
                    window.location.href = data.redirect_url;
                }, 1000);
            } else {
                alert('❌ ' + (data.message || 'Signup failed'));
                btn.textContent = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            alert('❌ Connection error. Please ensure the server is running.');
            console.error(error);
            btn.textContent = originalText;
            btn.disabled = false;
        }
    });
    
    // Create floating particles animation
    function createParticle() {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 6 + 's';
        document.body.appendChild(particle);
        
        setTimeout(() => particle.remove(), 6000);
    }
    
    setInterval(createParticle, 300);
</script>

</body>
</html>
