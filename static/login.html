<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ResQAlert</title>
  <link rel="stylesheet" href="login-style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <nav class="navbar">
    <a href="index.html" class="logo">ResQAlert</a>
    <a href="index.html" class="back-link">← Back to Home</a>
  </nav>

  <div class="login-container">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Login to access your disaster monitoring dashboard</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password"
          required
        >
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember" name="remember">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

   <div class="signup-link">
    Don't have an account?
    <a href="signup.html">Sign Up</a>
</div>

     <script>
    // Prevent default form submission if form exists
    const loginForm = document.querySelector('form');
    if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
        });
    }

    // Handle login button click
    document.querySelector('.login-btn').addEventListener('click', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if (!email || !password) {
            alert('⚠️ Please fill in all fields');
            return;
        }
        
        // Show loading state
        const btn = this;
        const originalText = btn.textContent;
        btn.textContent = 'Logging in...';
        btn.disabled = true;
        
        try {
            const response = await fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                btn.textContent = '✅ Success! Redirecting...';
                
                // Redirect to Streamlit after 1 second
                setTimeout(() => {
                    window.location.href = data.redirect_url;
                }, 1000);
            } else {
                alert('❌ ' + (data.message || 'Login failed'));
                btn.textContent = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            alert('❌ Connection error. Please ensure the server is running.');
            console.error(error);
            btn.textContent = originalText;
            btn.disabled = false;
        }
    });
    
    // Create floating particles
    function createParticle() {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 6 + 's';
        document.body.appendChild(particle);
        
        setTimeout(() => particle.remove(), 6000);
    }
    
    setInterval(createParticle, 300);
</script>

</body>
</html>
